aid: replay
name: Replay
description: >-
  Replay is an AI-native QA and time-travel debugging platform for web applications. Replay QA
  autonomously explores a web app, records every session in a deterministic Replay Browser, finds
  real bugs, and hands a coding agent the root cause and a suggested fix. The recording is a
  time-travel database of everything that happened in the browser — sources, console, network,
  DOM, React renders — inspectable after the fact without reproducing the bug locally. Replay
  exposes this programmatically through a GraphQL API, a WebSocket Replay Protocol, a published
  Model Context Protocol (MCP) server for agent debugging, a CLI (replayio), and Playwright/Cypress
  recording integrations. Backed by a16z and Version One Ventures.
